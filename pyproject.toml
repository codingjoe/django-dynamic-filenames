[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-dynamic-filenames"
readme = "README.md"
keywords = [ "django", "django-pictures", "django-storages", "file", "filenames" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [ "django>=5.2" ]
urls.Changelog = "https://github.com/codingjoe/django-dynamic-filenames/releases"
urls.Documentation = "https://github.com/codingjoe/django-dynamic-filenames?tab=readme-ov-file"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/django-dynamic-filenames"
urls.Issues = "https://github.com/codingjoe/django-dynamic-filenames/issues"
urls.Releasenotes = "https://github.com/codingjoe/django-dynamic-filenames/releases/latest"
urls.Source = "https://github.com/codingjoe/django-dynamic-filenames"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "dynamic_filenames/_version.py"

[tool.flit]
module.name = "dynamic_filenames"

[tool.ruff]
line-length = 88
indent-width = 4
src = [ "dynamic_filenames", "tests" ]
format.preview = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.select = [
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "EXE", # flake8-executable
  "F",   # pyflakes
  "I",   # isort
  "PGH", # pygrep-hooks
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [ "D1", "E501", "PT012" ]
lint.per-file-ignores."tests/**" = [ "S" ]
lint.flake8-pytest-style.fixture-parentheses = false
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "dynamic_filenames", "tests" ]
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs"
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "dynamic_filenames" ]
report.skip_covered = true
report.show_missing = true
